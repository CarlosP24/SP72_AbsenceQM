title: QUDYMA talk
author: Carlos Payá
version: 1.0.0
quarto-required: ">=1.6.0"
contributes:
  formats:
    revealjs:
      theme: [default, qudyma.scss]
      css: [fonts/montserrat.css]
      include-in-header: [katex-static.html]
      template-partials:
        - title-slide.html
      revealjs-plugins:
        - plugin
      # Local KaTeX: math renders offline. The path is relative to the document, so the
      # .qmd must sit next to _extensions/ (the usual layout of a talk folder).
      html-math-method:
        method: katex
        url: "_extensions/qudyma/katex/"
      width: 1600
      height: 900
      margin: 0
      min-scale: 0.2
      max-scale: 3.0
      center: false
      date-format: "D MMMM YYYY"
      transition: fade
      transition-speed: fast
      background-transition: fade
      controls: false
      progress: true
      slide-number: c
      show-slide-number: all
      hash: true
      fragment-in-url: true
      navigation-mode: linear
      preview-links: false
      auto-stretch: false
      menu:
        side: left
        numbers: true
        hideMissingTitles: true
        openButton: false
